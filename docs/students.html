<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="shortcut icon" href="./favicon.svg" type="image/x-icon" />
  <script defer src="./students.js"></script>
</head>
<body>
  <div class="header">
    <div>
      <h1>School Dashboard</h1>
      <h2>Students, courses, and enrollments</h2>
    </div>
    <button class="btn-secondary" id="logout-btn">Log Out</button>
  </div>

  <nav class="dashboard-tabs" aria-label="Dashboard sections">
    <button class="dashboard-tab active" data-view="students">Students</button>
    <button class="dashboard-tab" data-view="courses">Courses</button>
    <button class="dashboard-tab" data-view="enrollments">Enrollments</button>
  </nav>

  <section id="students-view" class="dashboard-view">
    <div class="section-header">
      <div>
        <h2>Students</h2>
        <p>All registered students.</p>
      </div>
    </div>
    <div id="student-list" class="resource-grid"></div>
  </section>

  <section id="courses-view" class="dashboard-view" hidden>
    <div class="section-header">
      <div>
        <h2>Courses</h2>
        <p>Create and manage the new Course resource.</p>
      </div>
    </div>

    <form id="course-form" class="panel-form">
      <input type="hidden" id="course-id" />
      <div class="form-group">
        <label for="course-title">Title</label>
        <input type="text" id="course-title" placeholder="Web Development" required />
      </div>
      <div class="form-group">
        <label for="course-description">Description</label>
        <input type="text" id="course-description" placeholder="Build REST APIs with Node and Express" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="course-credits">Credits</label>
          <input type="number" id="course-credits" min="1" max="10" step="1" required />
        </div>
        <div class="form-group">
          <label for="course-instructor">Instructor</label>
          <input type="text" id="course-instructor" placeholder="Dr. Smith" required />
        </div>
      </div>
      <p id="course-error" class="form-error" hidden></p>
      <div class="form-actions">
        <button type="submit" class="btn-primary" id="course-submit">Create Course</button>
        <button type="button" class="btn-secondary" id="course-cancel" hidden>Cancel Edit</button>
      </div>
    </form>

    <div id="course-list" class="resource-grid"></div>
  </section>

  <section id="enrollments-view" class="dashboard-view" hidden>
    <div class="section-header">
      <div>
        <h2>Enrollments</h2>
        <p>Connect students to courses and track semester status.</p>
      </div>
    </div>

    <form id="enrollment-form" class="panel-form">
      <input type="hidden" id="enrollment-id" />
      <div class="form-row">
        <div class="form-group">
          <label for="enrollment-student">Student</label>
          <select id="enrollment-student" required></select>
        </div>
        <div class="form-group">
          <label for="enrollment-course">Course</label>
          <select id="enrollment-course" required></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="enrollment-semester">Semester</label>
          <input type="text" id="enrollment-semester" placeholder="Fall 2026" required />
        </div>
        <div class="form-group">
          <label for="enrollment-grade">Grade</label>
          <input type="number" id="enrollment-grade" min="0" max="20" step="0.1" placeholder="optional" />
        </div>
      </div>
      <div class="form-group">
        <label for="enrollment-status">Status</label>
        <select id="enrollment-status" required>
          <option value="enrolled">enrolled</option>
          <option value="completed">completed</option>
          <option value="dropped">dropped</option>
        </select>
      </div>
      <p id="enrollment-error" class="form-error" hidden></p>
      <div class="form-actions">
        <button type="submit" class="btn-primary" id="enrollment-submit">Create Enrollment</button>
        <button type="button" class="btn-secondary" id="enrollment-cancel" hidden>Cancel Edit</button>
      </div>
    </form>

    <div id="enrollment-list" class="resource-list"></div>
  </section>

  <!-- Student detail modal -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-avatar" id="modal-avatar"></div>
      <div class="modal-name" id="modal-name"></div>
      <div class="modal-major" id="modal-major"></div>
      <div class="modal-gpa" id="modal-gpa"></div>
      <p class="modal-note" id="modal-note" hidden>You can only edit or delete your own account.</p>

      <!-- own profile actions — shown only if card belongs to logged in user -->
      <div id="modal-actions" hidden>
        <button class="btn-secondary" id="modal-edit-btn">Edit Profile</button>
        <button class="btn-danger" id="modal-delete-btn">Delete Account</button>
      </div>
    </div>
  </div>

  <!-- Edit profile modal -->
  <div class="modal-overlay" id="edit-overlay" hidden>
    <div class="modal">
      <button class="modal-close" id="edit-close">&times;</button>
      <h2 style="margin-bottom:1.25rem;font-size:1.2rem;">Edit Profile</h2>
      <form id="edit-form" class="auth-form" style="text-align:left;">
        <div class="form-group">
          <label for="edit-name">Full Name</label>
          <input type="text" id="edit-name" />
        </div>
        <div class="form-group">
          <label for="edit-email">Email</label>
          <input type="email" id="edit-email" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="edit-major">Major</label>
            <input type="text" id="edit-major" />
          </div>
          <div class="form-group">
            <label for="edit-gpa">GPA</label>
            <input type="number" id="edit-gpa" step="0.1" min="0" max="4" />
          </div>
        </div>
        <div class="form-group">
          <label for="edit-image">Profile Picture <span class="optional">(optional)</span></label>
          <div class="file-input-wrapper">
            <input type="file" id="edit-image" accept="image/jpg,image/jpeg,image/png" />
            <label for="edit-image" class="file-input-label">
              <span id="edit-file-label-text">Change photo…</span>
            </label>
          </div>
        </div>
        <p id="edit-error" class="form-error" hidden></p>
        <button type="submit" class="btn-primary btn-full">Save Changes</button>
      </form>
    </div>
  </div>
</body>
</html>
